services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: docker-with-nextjs
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - WATCHPACK_POLLING_INTERVAL=1000
    command : npm run dev
