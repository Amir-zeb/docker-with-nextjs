name: Build & Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        run: |
          docker build -f Dockerfile.prod -t ${{ secrets.DOCKER_USERNAME }}/docker-with-nextjs-app:v1.0.${{ github.run_number }} .

      - name: Push image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/docker-with-nextjs-app:v1.0.${{ github.run_number }}
